version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits prefixes so release-please lists runtime bumps as fixes.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Kept on the major feedsmith depends on, so only one copy is installed and bundled.
      # Move it when feedsmith does.
      - dependency-name: entities
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
