name: PR title

# PRs are squash merged, so the title becomes the commit on main that release-please reads.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional:
    name: Conventional Commits
    if: github.repository == 'tanatyu12/pochi'
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^A-Z ].*[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            printf '%s\n' "::error::The title must read like 'fix(init): ask about a source only when it fails', with a type from AGENTS.md, a lowercase summary and no final period."
            exit 1
          fi
