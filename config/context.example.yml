# Copy to config/context.yml (or run `pochi init`). In CI, put the contents in the
# POCHI_CONTEXT_YAML secret instead; it takes precedence over the file.
version: 1

project:
  name: my-app
  description: A Next.js SaaS app with a Postgres backend and an LLM-powered support chat.

# What you want to hear about (1-20 entries).
problems:
  - Breaking changes and security fixes in Next.js and React
  - Cheaper or faster LLMs for customer support chat

# What to drop even if it looks related (0-30 entries).
exclude:
  - Funding news and company acquisitions

# Language for the summaries the LLM writes. Labels stay in English.
language: English

llm:
  provider: auto        # auto | api | claude | codex (auto uses ANTHROPIC_API_KEY if set, else the claude CLI, else codex)
  triageModel: ~        # default: claude-haiku-5-5 (api) / haiku (claude) / codex's own model (codex)
  analyzeModel: ~       # default: claude-sonnet-5-5 (api) / sonnet (claude) / codex's own model (codex)
  maxItemsPerCall: 40
  maxItemsPerRun: 150

notify:
  minImpact: Low        # High | Medium | Low
  postWhenEmpty: false  # deliver a "No relevant updates" note on quiet days
  channels:             # where the briefing goes, in this order
    - type: slack       # the webhook is read from SLACK_WEBHOOK_URL only
    # - type: file      # writes <dir>/<YYYY-MM-DD>.md
    #   dir: reports

state:
  ttlDays: 45           # must be greater than maxItemAgeDays
  maxItemAgeDays: 14

# When `pochi schedule install` runs pochi (dependabot-style). Omit for daily at 06:17.
schedule:
  interval: daily       # daily | weekly | monthly (the 1st) | cron
  # day: [monday, thursday]  # weekly only: one day or a list (default monday)
  time: "06:17"         # HH:MM, 24-hour; not used with interval: cron
  # timezone: Asia/Tokyo     # default: this machine's zone (UTC for --backend github)
  # cronjob: "17 6 * * 1-5"  # interval: cron only: minute hour day-of-month month day-of-week
